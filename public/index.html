<style>
/* VOICE: institucional y clínico; herramienta de supervisión para alta dirección
   IDEA: la cédula oficial de supervisión en papel membretado convertida en formulario vivo
   PICTURE: el propio cuestionario y las tarjetas de hospital con el estado de cada servicio
   COLOUR/TYPE: guinda institucional dominante, oro de apoyo, teal para lo validado; Noto Serif en títulos, Noto Sans en texto
   LAYOUT: barra guinda superior, menú lateral de 10 módulos, contenido en tarjetas de una columna */
:root{color-scheme:light dark;
--bg:light-dark(#f6f2ef,#141012);--card:light-dark(#fff,#211a1d);--ink:light-dark(#1d1719,#f1e8ea);--mut:light-dark(#6b6064,#b8abaf);
--line:light-dark(#e7ddd9,#3a2f33);--g:#611232;--gh:#3a0c1c;--g2:light-dark(#9f2241,#e07a96);--gold:light-dark(#9c7a45,#d6b47e);
--teal:light-dark(#1e5b4f,#6cc2aa);--field:light-dark(#fcfaf9,#1a1416);--side:light-dark(#faf7f5,#1a1416);--sel:light-dark(#f3e7ea,#3b2229)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--gh);color:#fff;box-shadow:0 2px 8px #0004}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1.1 "Noto Serif",serif}
.brand em{font-style:normal;color:#d9b57c}
.brand small{font:700 11px "Noto Sans";letter-spacing:.08em;opacity:.8;padding-left:12px;border-left:1px solid #ffffff40;margin-left:4px}
.top .sp{flex:1}.conn{font-size:12px;padding:3px 10px;border-radius:99px;background:#ffffff1c;white-space:nowrap}
.menu-btn{display:none;background:none;border:0;color:#fff;font-size:22px;width:40px;height:40px;cursor:pointer}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 56px)}
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
aside h6{margin:4px 10px 8px;font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:700}
aside a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px;border:1px solid transparent}
aside a:hover{background:var(--sel)}
aside a.on{background:var(--card);border-color:var(--line);border-bottom:2px solid var(--g2);font-weight:600;box-shadow:0 1px 3px #0001}
aside a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
aside .badge{margin-left:auto;background:var(--g2);color:#fff;font-size:11px;border-radius:99px;padding:0 7px}
.asfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:14px}
.sw{width:38px;height:22px;border-radius:99px;background:var(--g2);border:0;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:19px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.sw.off::after{left:3px}.sw.off{background:#8886}
.who{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sel);color:var(--g2);font-weight:700;font-size:13px;border:1px solid var(--g2);flex:none}
.who b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who span{font-size:12px;color:var(--mut)}
main{padding:20px clamp(14px,3vw,36px) 60px}
.ph{margin-bottom:16px}.ph .crumb{font-size:13px;color:var(--mut);cursor:pointer;background:none;border:0;padding:0}
h1{font:800 clamp(26px,3.4vw,36px)/1.1 "Noto Serif",serif;margin:2px 0 4px;text-wrap:balance}
.ph p{margin:0;color:var(--mut);font-size:14px}
h2{font:700 19px/1.25 "Noto Serif",serif;margin:0 0 10px}
h3{font-size:16px;margin:0 0 12px;line-height:1.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 2px #0000000a}
.form{max-width:1000px}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--field);font-size:15px;font-weight:400}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g2);outline-offset:1px}
input.ro,input[readonly]{background:var(--bg);color:var(--mut)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:14px}
.g2c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.g4c{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opts.col{grid-template-columns:1fr}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:400;font-size:14.5px;cursor:pointer;min-height:44px;background:var(--field)}
.opt input{width:18px;height:18px;min-height:0;accent-color:var(--g2);flex:none;margin:0}
.opt:has(input:checked){border-color:var(--g2);background:var(--sel)}
.hint{font-size:12.5px;color:var(--mut);margin:8px 0 0}
.warn{background:light-dark(#fff6e8,#3a2c14);border:1px solid light-dark(#efd3a3,#6b5226);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:10px 0}
.err{background:light-dark(#fdecef,#3d1820);border:1px solid var(--g2);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:10px 0}
.err ul{margin:4px 0 0;padding-left:18px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:14px}
.btn.pri{background:var(--g2);border-color:var(--g2);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--g2);cursor:pointer;font-weight:600;font-size:13px;padding:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.clave,.evt{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--field)}
.clhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.rk{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--sel);color:var(--g2);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-align:left;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.q3 input,.q6 input{min-width:76px;text-align:right}
.calc{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);z-index:5}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{font-size:12.5px;color:var(--mut);display:block}
.kpi b{font:800 clamp(24px,3vw,32px)/1.15 "Noto Serif",serif;display:block;margin-top:4px}
.kpi small{font-size:12px;color:var(--mut)}
.hosp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.hh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.hh h3{margin:0;text-transform:uppercase;font-size:15.5px}
.hh .meta{font-size:12.5px;color:var(--mut)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mut);margin:10px 0}
.stats b{color:var(--ink)}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.svc{display:flex;gap:10px;align-items:center;text-align:left;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;background:var(--field);cursor:pointer;min-height:52px}
.svc:hover{border-color:var(--g2)}
.svc .ic{font-size:18px;color:var(--mut);width:18px;text-align:center}
.svc b{display:block;font-size:14px;font-weight:600}.svc small{font-size:12px}
.svc.done{border-style:solid}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st-Pendiente{color:var(--mut)}
.st-En_captura{color:#8a6420;background:#bc955c26}
.st-Enviado{color:#245e8a;background:#3a7fb526}
.st-En_validación{color:#6a3d8c;background:#8a5ab526}
.st-Validado{color:var(--teal);background:#1e5b4f22}
.st-Con_observaciones{color:#b0561a;background:#d9752a26}
.st-Requiere_seguimiento{color:#fff;background:var(--g2)}
.lv-Crítica{background:#9f2241;color:#fff}.lv-Alta{background:#d9752a;color:#fff}.lv-Moderada{background:#e8c25a;color:#3a2a00}.lv-Baja{background:#8aa39c;color:#fff}
.cl-Desabasto{background:#9f2241;color:#fff}.cl-Abasto_insuficiente{background:#e8c25a;color:#3a2a00}.cl-Abasto_suficiente{background:#1e5b4f;color:#fff}
.cl-Información_pendiente{background:#8886;color:var(--ink)}.cl-No_aplica{background:transparent;border:1px solid var(--line);color:var(--mut)}.cl-Sin_umbral{background:transparent;border:1px dashed var(--mut);color:var(--mut)}
.sem{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tag{font-size:11.5px;color:var(--gold);font-weight:700;border:1px solid var(--gold);border-radius:6px;padding:1px 7px}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;text-align:left;width:100%}
.al small{color:var(--mut);font-size:12.5px;display:block}
.hbar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hbar .tr{height:14px;background:var(--bg);border-radius:4px;overflow:hidden}.hbar .tr i{display:block;height:100%;background:var(--g2)}
.fig{position:relative;min-height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px;min-height:36px}
.tabs button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
#modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:16px;max-width:860px;width:100%;padding:22px 24px;box-shadow:0 20px 60px #0006}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gh);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;display:none;font-size:14px;max-width:90vw}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px}
.dl{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:4px 14px;font-size:14px}.dl dt{color:var(--mut)}.dl dd{margin:0}
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rep .card{margin:0;display:flex;flex-direction:column;gap:8px}.rep .card p{margin:0;font-size:13px;color:var(--mut);flex:1}
.mx td{text-align:center}.mx td:first-child{text-align:left}
.mx input{width:20px;height:20px;min-height:0;accent-color:var(--g2)}
.banner{background:light-dark(#fff6e8,#3a2c14);border-bottom:1px solid light-dark(#efd3a3,#6b5226);padding:8px 18px;font-size:13px;display:none}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{position:fixed;left:0;top:56px;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px #0003}
aside.open{transform:none}.menu-btn{display:block}.brand small{display:none}.g4c{grid-template-columns:repeat(2,minmax(0,1fr))}.span3{grid-column:span 2}}
@media(max-width:600px){.g2c,.g4c{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.brand{font-size:14px}.conn{display:none}
.al{grid-template-columns:1fr}.hbar{grid-template-columns:1fr 60px}.hbar .tr{grid-column:1/-1;grid-row:2}.dl{grid-template-columns:1fr}
table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut);font-size:12px}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

function saveLocal(){if(mode!=='local')return;try{localStorage.setItem('sestah_v1',JSON.stringify({CFG,CAT,store}))}catch(e){}}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem('sestah_v1')||'null');if(j){CFG=Object.assign(clone(DEF),j.CFG);CAT=j.CAT||CAT;Object.assign(store,j.store)}}catch(e){}}
async function put(col,id,data){
 if(col==='config'){if(id==='main')CFG=data;else CAT=data}else store[col][id]=data;
 render(true);
 if(db){try{await db.collection(col).doc(id).set(data)}catch(e){toast(e.code==='quota_exceeded'?'Capacidad de almacenamiento agotada: depure registros antiguos.':'No se pudo guardar ('+(e.code||'error')+'). Verifique sus permisos.');throw e}}
 else if(mode==='net'){const r=await fetch('/api/doc',{method:'PUT',headers:{'content-type':'application/json','x-sestah-clave':netKey},body:JSON.stringify({col,id,data})}).catch(()=>null);
  if(!r||!r.ok){const j=r?await r.json().catch(()=>({})):{};toast('No se pudo guardar: '+(j.error||'sin conexión con el servidor')+'.');throw new Error('net')}}
 else saveLocal();
}
/* ---- Modo servidor (Netlify) ---- */
let netKey='',netTimer=null;
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
function lsSet(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
function fileDL(){return{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return{status:'saved'}}}}
async function netFetch(){const r=await fetch('/api/data',{headers:{'x-sestah-clave':netKey},cache:'no-store'});if(r.status===401)return 401;if(!r.ok)throw new Error('http '+r.status);return r.json()}
function netApply(j){canAdmin=!!j.admin;const c=j.config||{};if(c.main)CFG=Object.assign(clone(DEF),c.main);if(c.catalogo)CAT=c.catalogo;['cuestionarios','alertas','perfiles'].forEach(k=>store[k]=j[k]||{})}
function keyModal(msg){
 openModal(`<h2>Acceso al sistema</h2><p class="hint">Capture la clave de acceso proporcionada por el Departamento de Supervisión y Desarrollo en Salud.</p>${msg?`<div class="err">${esc(msg)}</div>`:''}
 <label style="margin-top:12px">Clave de acceso<input type="password" id="k_in" autocomplete="current-password"></label><div class="row" style="margin-top:14px"><button class="btn pri" id="k_ok">Ingresar</button></div>`,()=>{
  const go=()=>{const v=$('#k_in').value.trim();if(!v)return;netKey=v;closeModal();netStart()};$('#k_ok').onclick=go;$('#k_in').onkeydown=e=>{if(e.key==='Enter')go()};$('#k_in').focus()});
}
async function netStart(){
 if(!netKey){keyModal();return}
 let j;try{j=await netFetch()}catch(e){mode='local';loadLocal();setConn('Modo local');banner('No se pudo conectar con el servidor de la aplicación. Los datos se guardan solo en este navegador.');render();askPerf();return}
 if(j===401){lsSet('sestah_clave','');netKey='';keyModal('Clave de acceso inválida.');return}
 lsSet('sestah_clave',netKey);mode='net';netApply(j);setConn(canAdmin?'Conectado · Administración':'Conectado');banner('');render();askPerf();
 clearInterval(netTimer);netTimer=setInterval(async()=>{if(document.hidden)return;try{const x=await netFetch();if(x!==401){netApply(x);render(true)}}catch(e){setConn('Sin conexión')}},45000);
}
function setConn(t){$('#conn').textContent=t}
function banner(t){const b=$('#banner');b.textContent=t||'';b.style.display=t?'block':'none'}

async function init(){
 navRender();applyTheme(localStorage.getItem('sestah_theme')||'');
 if(typeof claude==='undefined'||!claude.use){DL=fileDL();uid=lsGet('sestah_uid')||('u'+rid());lsSet('sestah_uid',uid);netKey=lsGet('sestah_clave');render();netStart();return}
 render();
 const [d,u,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
 DL=dl;usr=u;
 if(u){try{uid=await u.id()}catch(e){}try{canAdmin=!!(await u.canEdit())}catch(e){}try{const p=await u.me();meName=p?.name||''}catch(e){}}
 if(!d||!uid){mode='local';loadLocal();setConn('Modo local');banner('Sin acceso al almacenamiento compartido (inicie sesión). Los datos se guardan solo en este navegador.');render();askPerf();return}
 db=d;mode='db';setConn('Conectado');subscribe();
}
function subscribe(){
 let got=0;const tm=setTimeout(()=>{if(got<4)banner('No se ha podido confirmar la conexión con el almacenamiento compartido; la información puede estar desactualizada.')},10000);
 const ok=()=>{got++;if(got>=4){clearTimeout(tm);banner('')}};
 const fail=e=>{setConn('Sin conexión');banner('Conexión interrumpida ('+(e.code||'error')+'). Recargue la página más tarde.')};
 db.doc('config/main').onSnapshot(s=>{if(s.exists)CFG=Object.assign(clone(DEF),clone(s.data()));if(!s.metadata.fromCache)ok();render()},fail);
 db.doc('config/catalogo').onSnapshot(s=>{if(s.exists)CAT=clone(s.data());if(!s.metadata.fromCache)ok();render()},fail);
 const col=(c,q,last)=>q.onSnapshot(s=>{store[c]={};s.docs.forEach(d=>store[c][d.id]=d.data());if(!s.metadata.fromCache)ok();render();if(last)askPerf()},fail);
 col('cuestionarios',db.collection('cuestionarios').orderBy('creado','desc').limit(1000));
 col('alertas',db.collection('alertas').orderBy('creado','desc').limit(1000));
 col('perfiles',db.collection('perfiles'),true);
}

function hospsF(){return CFG.hospitales.filter(h=>(!FL.hosp||h.clues===FL.hosp)&&(!FL.mun||h.municipio===FL.mun)&&(!FL.reg||h.region===FL.reg)&&(!FL.niv||h.nivel===FL.niv))}

/* ============ CÁLCULOS ============ */
function indic(r){
 const m=r.q3?.med||{},c=r.q3?.mc||{};const t=k=>{const x=[m[k],c[k]].filter(v=>v!=null);return x.length?x.reduce((a,b)=>a+b,0):null};
 const ds=r.dispositivos||[];
 return{cMed:pct(m.B,m.A),eMed:pct(m.D,m.A),cMc:pct(c.B,c.A),eMc:pct(c.D,c.A),cGlob:pct(t('B'),t('A')),eGlob:pct(t('D'),t('A')),
  emerg:pct(sum(ds,d=>d.B),sum(ds,d=>d.A)),crit:(r.claves||[]).filter(k=>k.prio==='Crítica').length,sinSust:(r.claves||[]).filter(k=>k.sust==='No').length,
  dif:(r.eventos||[]).filter(e=>e.tipo==='Diferimiento').length,canc:(r.eventos||[]).filter(e=>e.tipo==='Cancelación').length}}
function clasif(r){
 if(!r||!COMPLETOS.includes(r.estado))return'Información pendiente';
 if(r.q1&&r.q1!=='no')return'Desabasto';
 const g=indic(r).cGlob;if(g==null)return'No aplica';
 const u=CFG.umbrales.surtSuf;if(u==null)return'Sin umbral';
 return g>=u?'Abasto suficiente':'Abasto insuficiente'}
function sem(v,suf,insuf){if(v==null||suf==null)return'';const c=v>=suf?'#1e5b4f':(insuf!=null&&v<insuf)?'#9f2241':'#e8c25a';return`<span class="sem" style="background:${c}"></span>`}
function critScore(k){return(k.sust==='No'?100:0)+({Crítica:30,Alta:20,Media:10}[k.prio]||0)+({Alto:15,Medio:8,Bajo:2}[k.imp]||0)+Math.min(k.dias||0,30)}
function lvOf(s){return s>=8?'Crítica':s>=6?'Alta':s>=4?'Moderada':'Baja'}
function genAlerts(r){
 const out=[],base={recId:r.id,folio:r.folio,clues:r.clues,hospital:r.hospital,region:r.region,nivel_atencion:r.nivel,servicio:r.servicio,fecha:r.fecha};
 const add=(tipo,detalle,cr)=>{const s=cr.impacto+cr.sust+cr.tiempo+cr.respuesta;out.push(Object.assign({},base,{tipo,detalle,criterios:cr,score:s,nivel:lvOf(s)}))};
 (r.claves||[]).forEach(k=>{if(k.prio==='Crítica'||k.exist===0||k.sust==='No'){
  const cr={impacto:{Alto:3,Medio:2,Bajo:1}[k.imp]||1,sust:k.sust==='No'?3:0,tiempo:(k.dias||0)>=7?3:(k.dias||0)>=3?2:(k.dias||0)>=1?1:0,respuesta:k.exist===0?1:0};
  add(k.sust==='No'?'Insumo sin sustitución':'Clave crítica sin disponibilidad',`${k.clave||'s/clave'} · ${k.desc||''} (${k.grupo||''}); existencia ${k.exist??'n/r'}, ${k.dias??0} días sin disponibilidad, prioridad ${k.prio||'n/r'}`,cr)}});
 (r.eventos||[]).forEach(e=>{const cr={impacto:(e.personas||0)>=5?3:(e.personas||0)>=1?2:1,sust:0,tiempo:e.tipo==='Cancelación'?3:2,respuesta:(e.inmed==='Sí'?2:0)+(e.medida?0:1)};
  add(e.tipo==='Cancelación'?'Cancelación de procedimientos':'Diferimiento de atención',`${e.atencion||''}: ${e.personas??0} persona(s) afectada(s). Motivo: ${e.motivo||''}. Insumo: ${e.insumo||''}`,cr)});
 (r.dispositivos||[]).forEach(d=>{const p=pct(d.B,d.A);const u=CFG.umbrales.emergSuf??100;if(p!=null&&p<u){
  const cr={impacto:d.id==='carro'?3:2,sust:0,tiempo:p<50?3:p<80?2:1,respuesta:d.id==='carro'?2:1};add('Insuficiencia en dispositivo de emergencia',`${d.n}: ${fp(p)} de abasto (${d.B}/${d.A} claves). Faltantes: ${d.falt||'n/r'}`,cr)}});
 const prev=Qs().filter(x=>x.id!==r.id&&x.clues===r.clues&&x.servicio===r.servicio&&COMPLETOS.includes(x.estado)&&x.fecha<=r.fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.creado.localeCompare(a.creado));
 const bad=c=>c==='Desabasto'||c==='Abasto insuficiente';const cur=clasif(r);
 const n=CFG.umbrales.recurrencia||3;
 if(bad(cur)&&prev.slice(0,n-1).length>=n-1&&prev.slice(0,n-1).every(x=>bad(clasif(x))))add('Abasto insuficiente recurrente',`${n} capturas consecutivas con ${cur.toLowerCase()} en el servicio.`,{impacto:2,sust:0,tiempo:3,respuesta:1});
 const g=indic(r).cGlob,pg=prev[0]?indic(prev[0]).cGlob:null;
 if(g!=null&&pg!=null&&pg-g>=(CFG.umbrales.deterioro||10))add('Deterioro respecto al periodo anterior',`Surtimiento global bajó de ${fp(pg)} (${prev[0].fecha}) a ${fp(g)}.`,{impacto:2,sust:0,tiempo:1,respuesta:1});
 return out}

function calcQ3(){
 const q=readQ3(),er=[];
 [['med','Medicamentos'],['mc','Material de curación']].forEach(([g,t])=>{const x=q[g];
  ['A','B','D','F'].forEach(k=>{if(x[k]!=null&&(x[k]<0||!Number.isInteger(x[k])))er.push(`${t}: ${k} debe ser un entero no negativo.`)});
  if(x.A!=null&&x.B!=null&&x.B>x.A)er.push(`${t}: B (surtidas) no puede ser mayor que A (solicitadas).`);
  if(x.B!=null&&x.D!=null&&x.D>x.B)er.push(`${t}: D (surtimiento completo) no puede ser mayor que B (surtidas).`);
  if(x.B!=null&&x.F!=null&&x.F>x.B)er.push(`${t}: F no puede ser mayor que B (surtidas).`);
  if(x.D!=null&&x.F!=null&&x.B!=null&&x.D+x.F>x.B)er.push(`${t}: D + F no puede exceder B.`);
  const cell=(id,b)=>$('#q3_'+g+'_'+id).innerHTML=x.A===0?'N/A':(x.A==null||b==null)?'—':sem(pct(b,x.A),CFG.umbrales.surtSuf,CFG.umbrales.surtInsuf)+fp(pct(b,x.A));
  cell('C',x.B);cell('E',x.D)});
 $('#q3err').innerHTML=er.length?`<div class="err">${er.map(esc).join('<br>')}</div>`:'';return er}

function validate(r,full){
 const e=[];const h=H(r.clues);
 if(!r.fecha)e.push('Fecha de captura.');if(!h)e.push('Establecimiento.');
 if(!r.servicio)e.push('Servicio.');else if(h&&!h.cartera.includes(r.servicio))e.push('El servicio no pertenece a la cartera del establecimiento.');
 if(!full)return e;
 if(!r.hora)e.push('Hora de registro.');
 if(!r.q1)e.push('Pregunta 1: seleccione una opción.');
 if(r.q1&&r.q1!=='no'){if(!r.claves.length)e.push('Pregunta 2: registre al menos una clave faltante.');
  r.claves.forEach((k,i)=>{const n='Pregunta 2, clave '+(k.clave||i+1)+': ';if(!k.clave)e.push(n+'clave institucional.');if(!k.desc)e.push(n+'descripción.');if(!k.prio)e.push(n+'prioridad.');if(!k.just)e.push(n+'justificación de la prioridad.');if(!k.sust)e.push(n+'indique si existe sustituto.');if(k.sust==='Sí'&&!k.sustd)e.push(n+'describa el sustituto.');if(!k.imp)e.push(n+'impacto sobre la atención.');
   ['exist','cons','nec','dias'].forEach(f=>{if(k[f]!=null&&k[f]<0)e.push(n+'sin valores negativos.')})})}
 calcQ3().forEach(x=>e.push('Pregunta 3: '+x));
 ['med','mc'].forEach(g=>{const x=r.q3[g];if(x.A==null)e.push('Pregunta 3: capture claves solicitadas (A) de '+(g==='med'?'medicamentos':'material de curación')+' (0 si no hubo).');else if(x.A>0&&(x.B==null||x.D==null||x.F==null))e.push('Pregunta 3: complete B, D y F de '+(g==='med'?'medicamentos':'material de curación')+'.')});
 if(!r.q4)e.push('Pregunta 4: seleccione una opción.');
 if(r.q4==='Sí'){if(!r.eventos.length)e.push('Pregunta 5: registre al menos un evento.');r.eventos.forEach((v,i)=>{if(!v.tipo||!v.motivo||!v.atencion||v.personas==null||!v.inmed)e.push('Pregunta 5, evento '+(i+1)+': complete tipo, motivo, tipo de atención, personas afectadas e intervención inmediata.')})}
 calcQ6().forEach(x=>e.push('Pregunta 6: '+x));
 r.dispositivos.forEach(d=>{if(d.A==null||d.B==null)e.push('Pregunta 6: capture A y B de '+d.n+'.');if(!d.resp)e.push('Pregunta 6: responsable de verificación de '+d.n+'.');if(!d.res)e.push('Pregunta 6: resultado de la revisión de '+d.n+'.')});
 [7,8].forEach(n=>{if(!r['q'+n])e.push('Pregunta '+n+': seleccione la frecuencia.');else if(r['q'+n]==='Otro'&&!r['q'+n+'otro'])e.push('Pregunta '+n+': describa la frecuencia.')});
 if(!r.firmas.resp)e.push('Nombre del responsable del servicio.');if(!r.firmas.sup)e.push('Nombre de la persona supervisora.');
 const txt=JSON.stringify([r.eventos,r.firmas.obs,r.claves.map(k=>k.just)]);if(CURP.test(txt))e.push('Se detectó un posible CURP en el texto capturado. Elimine cualquier dato personal de pacientes.');
 return e}

 return{med:pct(g('med','B'),g('med','A')),mc:pct(g('mc','B'),g('mc','A')),comp:pct(both('D'),both('A')),emerg:pct(sum(ds,d=>d.B),sum(ds,d=>d.A)),
  crit:sum(recs,r=>indic(r).crit)||0,sin:sum(recs,r=>indic(r).sinSust)||0,afect:new Set(recs.filter(r=>(r.q1&&r.q1!=='no')||(r.eventos||[]).length).map(r=>r.clues+'|'+r.servicio)).size,

 const box=$('#trend'),s=box.querySelector('svg');const by={};recs.forEach(r=>{const k=bucket(r.fecha);(by[k]=by[k]||[]).push(r)});

  const x=i=>L+(ks.length===1?(W-L-R)/2:i*(W-L-R)/(ks.length-1)),y=v=>T+(100-v)*(Hh-T-B)/100;
  const line=(f,c)=>{let d='';ser.forEach((p,i)=>{const v=p[f];if(v==null)return;d+=(d?'L':'M')+x(i)+','+y(v)});return`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2"/>`+ser.map((p,i)=>p[f]==null?'':`<circle cx="${x(i)}" cy="${y(p[f])}" r="3.2" fill="${c}"><title>${esc(ks[i])}: ${fp(p[f])}</title></circle>`).join('')};

}
function pdfDoc(t,sub,o){const{jsPDF}=window.jspdf;const d=new jsPDF({orientation:o,unit:'mm',format:'letter'});const W=d.internal.pageSize.getWidth();
 d.setFillColor(58,12,28);d.rect(0,0,W,15,'F');d.setFillColor(188,149,92);d.rect(0,15,W,1.2,'F');d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(11);d.text('IMSS-BIENESTAR  ·  Coordinación Estatal Yucatán',10,7);
 d.setFont('helvetica','normal');d.setFontSize(8);d.text('Departamento de Supervisión y Desarrollo en Salud  ·  Sistema Estatal de Supervisión Territorial del Abasto (SESTAH)',10,12);
 d.setTextColor(97,18,50);d.setFont('helvetica','bold');d.setFontSize(14);d.text(t,10,24);d.setTextColor(90);d.setFont('helvetica','normal');d.setFontSize(8.5);d.text(sub||'',10,29);d.setTextColor(30);return d}
function pdfFoot(d){const n=d.getNumberOfPages(),W=d.internal.pageSize.getWidth(),Hh=d.internal.pageSize.getHeight();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(7.5);d.setTextColor(120);d.text('Documento generado por SESTAH. No contiene datos personales de pacientes.',10,Hh-6);d.text('Página '+i+' de '+n,W-10,Hh-6,{align:'right'})}}
function ejecPDF(R){
 if(!window.jspdf){toast('Biblioteca PDF no disponible.');return}
 const recs=recsF(),a=aggr(recs),cv=cobertura(),d=pdfDoc('Informe ejecutivo del abasto hospitalario',R.sub,'portrait');let y=38;
 const kp=[['Surtimiento de medicamentos',fp(a.med)],['Surtimiento de material de curación',fp(a.mc)],['Surtimiento completo',fp(a.comp)],['Insumos de emergencia',fp(a.emerg)],['Servicios con cuestionario completado',fp(cv.serv)+` (${cv.c}/${cv.t})`],['Hospitales con información validada',fp(cv.hosp)+` (${cv.hv}/${cv.hn})`],['Claves críticas faltantes',String(a.crit)],['Claves sin sustitución',String(a.sin)],['Servicios afectados',String(a.afect)],['Diferimientos / cancelaciones',a.dif+' / '+a.canc]];
 d.autoTable({head:[['Indicador','Valor']],body:kp,startY:y,styles:{fontSize:9},headStyles:{fillColor:[97,18,50]},columnStyles:{1:{halign:'right',fontStyle:'bold'}},margin:{left:12,right:12}});y=d.lastAutoTable.finalY+8;
 const crit=As().filter(x=>x.estado!=='Cerrada'&&(x.nivel==='Crítica'||x.nivel==='Alta')).sort((p,q)=>LV.indexOf(p.nivel)-LV.indexOf(q.nivel)).slice(0,15);
 d.setFont('helvetica','bold');d.setFontSize(11);d.setTextColor(97,18,50);d.text('Alertas críticas y altas activas',12,y);
 d.autoTable({head:[['Nivel','Hospital','Servicio','Tipo','Responsable']],body:crit.length?crit.map(x=>[x.nivel,x.hospital,x.servicio,x.tipo,x.responsable||'Sin asignar']):[['—','Sin alertas activas de nivel crítico o alto','','','']],startY:y+3,styles:{fontSize:8},headStyles:{fillColor:[97,18,50]},margin:{left:12,right:12}});y=d.lastAutoTable.finalY+8;
 d.setFont('helvetica','bold');d.setFontSize(11);d.setTextColor(97,18,50);d.text('Indicadores por región operativa y nivel de atención',12,y);
 d.autoTable({head:[['Agrupador','Cuest.','Med.','Mat. cur.','Completo','Emerg.','Críticas']],body:R.rows.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6]]),startY:y+3,styles:{fontSize:8},headStyles:{fillColor:[97,18,50]},margin:{left:12,right:12}});
 pdfFoot(d);dl(fname('Informe ejecutivo','pdf'),d.output('arraybuffer'));
}
function constPDF(r){
 if(!window.jspdf){toast('Biblioteca PDF no disponible.');return}
 const d=pdfDoc('Constancia digital de captura','Cuestionario de Abasto por servicio · Folio '+r.folio,'portrait'),i=r.ind||indic(r);
 d.autoTable({body:[['Folio',r.folio],['Establecimiento',r.hospital],['CLUES',r.clues],['Municipio / Región',r.municipio+' / '+r.region],['Nivel de atención',r.nivel],['Servicio',r.servicio],['Fecha y hora de captura',r.fecha+' '+r.hora+' ('+r.periodicidad+')'],['Fecha y hora de envío',fmtDT(r.envio)],['Clasificación',clasif(r)],
  ['Surtimiento medicamentos / material',fp(i.cMed)+' / '+fp(i.cMc)],['Surtimiento completo',fp(i.eGlob)],['Insumos de emergencia',fp(i.emerg)],['Claves faltantes registradas',String((r.claves||[]).length)+' ('+i.sinSust+' sin sustituto)'],['Eventos de diferimiento / cancelación',i.dif+' / '+i.canc],['Huella digital SHA-256',r.huella||'']],
  startY:36,theme:'grid',styles:{fontSize:8.5},columnStyles:{0:{fontStyle:'bold',cellWidth:62,fillColor:[248,244,242]}},margin:{left:14,right:14}});
 let y=d.lastAutoTable.finalY+28;const W=d.internal.pageSize.getWidth();
 [[r.firmas?.resp,r.firmas?.respCargo,'Responsable del servicio',14],[r.firmas?.sup,r.firmas?.supCargo,'Persona supervisora',W/2+6]].forEach(([n,c,l,x])=>{d.setDrawColor(97,18,50);d.line(x,y,x+W/2-20,y);d.setFontSize(9);d.setTextColor(30);d.text(n||'',x,y+5);d.setFontSize(8);d.setTextColor(100);d.text((c||'')+' · '+l,x,y+9)});
 if(r.firmas?.obs){d.setFontSize(8.5);d.setTextColor(30);d.text(d.splitTextToSize('Observaciones: '+r.firmas.obs,W-28),14,y+20)}
 pdfFoot(d);dl('Constancia_'+r.folio+'.pdf',d.output('arraybuffer'));
}

/* ============ ADMINISTRACIÓN ============ */
let modServ='';
function vAdmin(){
 const ed=canCfg(),U=CFG.umbrales,dis=ed?'':'disabled';const servs=[...new Set(CFG.hospitales.flatMap(h=>h.cartera))];modServ=modServ||servs[0]||'';
 $('#main').innerHTML=ph('Administración del Sistema','Parámetros institucionales, matriz servicio-dispositivo, módulos por servicio y perfiles')+
 (ed?'':'<div class="warn">Vista de solo lectura: los parámetros los modifica el propietario o un editor de la aplicación.</div>')+
 `<div class="card"><h3>Mi perfil</h3><p>${esc(myPerf()?.nombre||'Sin registrar')} · ${esc(myPerf()?.rol||'')} · ${esc(myPerf()?.region||'')}</p><button class="btn sm" id="ad_pf">Editar perfil</button></div>
 <div class="card"><h3>Umbrales del semáforo (parámetros institucionales)</h3><p class="hint">Capture únicamente valores aprobados (ficha técnica o lineamiento vigente). Vacío = no parametrizado. El sistema no asume metas normativas.</p>
 <div class="g4c" style="margin-top:10px"><label>Surtimiento: suficiente desde (%)<input type="number" id="u1" value="${U.surtSuf??''}" ${dis}></label><label>Surtimiento: crítico por debajo de (%)<input type="number" id="u2" value="${U.surtInsuf??''}" ${dis}></label><label>Insumos de emergencia: suficiente desde (%)<input type="number" id="u3" value="${U.emergSuf??''}" ${dis}></label><label>Fuente del parámetro<input id="u6" value="${esc(U.fuente||'')}" ${dis} placeholder="Ficha técnica / oficio"></label>
 <label>Recurrencia: capturas consecutivas<input type="number" id="u4" value="${U.recurrencia??3}" ${dis}></label><label>Deterioro: caída en puntos porcentuales<input type="number" id="u5" value="${U.deterioro??10}" ${dis}></label></div>
 ${ed?'<button class="btn pri" id="u_s" style="margin-top:12px">Guardar parámetros</button>':''}</div>
 <div class="card"><h3>Matriz de correspondencia servicio-dispositivo</h3><div class="scroll"><table class="mx"><thead><tr><th>Servicio</th>${DISP.map(d=>`<th style="text-align:center">${d.n}</th>`).join('')}</tr></thead><tbody>${servs.map(s=>`<tr><td>${esc(s)}</td>${DISP.map(d=>`<td><input type="checkbox" data-mx="${d.id}" value="${esc(s)}" ${applies(d.id,s)?'checked':''} ${dis||((CFG.matriz[d.id]||[]).includes('*')?'disabled':'')}></td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <label class="opt" style="max-width:420px;margin-top:10px"><input type="checkbox" id="mxAll" ${(CFG.matriz.carro||[]).includes('*')?'checked':''} ${dis}>Carro de Reanimación aplica a todos los servicios</label></div>
 <div class="card"><h3>Módulos adicionales por servicio</h3><p class="hint">Preguntas complementarias que aparecen solo en el cuestionario del servicio seleccionado.</p>
 <label style="max-width:360px">Servicio<select id="ms">${servs.map(s=>`<option ${s===modServ?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
 <ul id="mlist" style="padding-left:18px;font-size:14px">${((CFG.modulos||{})[modServ]||[]).map((q,i)=>`<li>${esc(q.texto)} <small>(${{sino:'Sí/No',num:'Número',texto:'Texto'}[q.tipo]})</small> ${ed?`<button class="lnk" data-mq="${i}">Quitar</button>`:''}</li>`).join('')||'<li>Sin preguntas adicionales.</li>'}</ul>
 ${ed?`<div class="row"><input id="mq_t" placeholder="Texto de la pregunta" style="max-width:420px"><select id="mq_k" style="max-width:150px"><option value="sino">Sí/No</option><option value="num">Número</option><option value="texto">Texto</option></select><button class="btn sm" id="mq_a">Agregar pregunta</button></div>`:''}</div>
 <div class="card"><h3>Perfiles registrados</h3><table class="stack"><thead><tr><th>Nombre</th><th>Cargo</th><th>Rol</th><th>Región</th></tr></thead><tbody>${Object.values(store.perfiles).map(p=>`<tr><td>${esc(p.nombre)}</td><td>${esc(p.cargo)}</td><td>${esc(p.rol)}</td><td>${esc(p.region)}</td></tr>`).join('')||'<tr><td colspan="4">Sin perfiles.</td></tr>'}</tbody></table></div>
 <div class="card"><h3>Respaldo y capacidad</h3><p class="hint">${Qs().length} cuestionarios y ${As().length} alertas cargados en esta vista. El almacenamiento admite hasta 25,000 documentos; programe respaldos periódicos.</p><div class="row"><button class="btn sm" id="bk">Descargar respaldo completo (JSON)</button>${mode==='net'?'<button class="btn sm" id="ko">Cerrar sesión en este equipo</button>':''}</div></div>`;
 $('#ko')&&($('#ko').onclick=()=>{lsSet('sestah_clave','');location.reload()});
 $('#ad_pf').onclick=perfModal;
 $('#bk').onclick=()=>dl('SESTAH_respaldo_'+today()+'.json',JSON.stringify({exportado:new Date().toISOString(),config:CFG,catalogo:CAT,cuestionarios:store.cuestionarios,alertas:store.alertas},null,1));
 $('#ms').onchange=e=>{modServ=e.target.value;render()};
 if(!ed)return;
 const save=()=>put('config','main',CFG).then(()=>toast('Configuración guardada.')).catch(()=>{});
 $('#u_s').onclick=()=>{const g=id=>num($('#'+id).value);const s1=g('u1'),s2=g('u2');if(s1!=null&&s2!=null&&s2>s1){toast('El umbral crítico no puede ser mayor que el de suficiencia.');return}
  CFG.umbrales={surtSuf:s1,surtInsuf:s2,emergSuf:g('u3'),recurrencia:Math.max(2,g('u4')||3),deterioro:g('u5')||10,fuente:$('#u6').value.trim()};save()};
 $$('[data-mx]').forEach(c=>c.onchange=()=>{const m=(CFG.matriz[c.dataset.mx]||[]).filter(x=>x!=='*'&&x!==c.value);if(c.checked)m.push(c.value);CFG.matriz[c.dataset.mx]=m;save()});
 $('#mxAll').onchange=e=>{CFG.matriz.carro=e.target.checked?['*']:[...servs];save()};
 $$('[data-mq]').forEach(b=>b.onclick=()=>{CFG.modulos[modServ].splice(+b.dataset.mq,1);save()});
 $('#mq_a').onclick=()=>{const t=$('#mq_t').value.trim();if(!t)return;CFG.modulos=CFG.modulos||{};(CFG.modulos[modServ]=CFG.modulos[modServ]||[]).push({id:'m'+rid(),texto:t,tipo:$('#mq_k').value});save()};
}

init();
}
</script>
